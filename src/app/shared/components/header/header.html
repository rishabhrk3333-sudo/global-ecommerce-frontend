<header class="header">
    <div class="header-container">
        <a routerLink="/products" class="logo">
            ShopSphere
        </a>
        <nav class="navigation">
            @for(item of navItems; track $index){
            <a [routerLink]="item.route" routerLinkActive="active">
                {{item?.label}}
            </a>
            @if (item.label === 'Cart' && cartService.itemCount() > 0) {
            <span class="cart-count"> {{ cartService.itemCount() }} </span> }
            }
        </nav>
        <button type="button" class="theme-toggle" (click)="themeService.toggleTheme()" [attr.aria-label]="
        themeService.isDarkMode()
            ? 'Switch to light mode'
            : 'Switch to dark mode'
    ">
            @if (themeService.isDarkMode()) {
            ☀
            } @else {
            ☾
            }
        </button>
        @if (authService.isLoggedIn()) {
        <button type="button" class="login-button" (click)="logout()">
            Logout
        </button>

        } @else {

        <a routerLink="/login" class="login-button">
            Login
        </a>
        }
    </div>
</header>
