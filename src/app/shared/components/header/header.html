<header class="header">
  <div class="header-container">
    <div class="logo-container">
      <a routerLink="/products" class="logo"> ShopSphere </a>
    </div>

    <nav class="navigation">
      @for (item of navItems; track item.route) {
        @if (!item.isAdmin || currentUser()?.role === 'admin') {
          <a [routerLink]="item.route" routerLinkActive="active">
            {{ item.label }}
            @if (item.label === 'Cart' && cartService.itemCount() > 0) {
              <span class="cart-count"> {{ cartService.itemCount() }} </span>
            }
          </a>
        }
      }
    </nav>

    <!-- Authentication -->
    <div class="header-actions">
      <button type="button" class="theme-toggle" (click)="themeService.toggleTheme()">
        @if (themeService.isDarkMode()) {
          ☀
        } @else {
          ☾
        }
      </button>
      @if (isLoggedIn()) {
        <span class="user-name">
          {{ currentUser()?.name }}
        </span>

        <button type="button" class="login-button" (click)="logout()">Logout</button>
      } @else {
        <a routerLink="/login" class="login-button"> Login </a>
      }
    </div>
  </div>
</header>
